name: Phantom Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 私有源码仓 lyq2010/lees-phantom 固定的 40 位提交 SHA
        required: true
        type: string
      version:
        description: 发布版本号（如 1.0.0）
        required: true
        type: string
      publish:
        description: 经确认后上传主 COS + 备 R2 并发布 GitHub Release；仅构建验包保持 false
        required: false
        default: false
        type: boolean
      run_tests:
        description: 构建前运行 Rust、Swift 与双内核集成测试
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: lees-phantom-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.check.outputs.revision }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 校验源码 SHA、版本号与版本说明
        id: check
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "source_sha 必须为 40 位小写十六进制提交 SHA" >&2; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "version 必须为 X.Y.Z 格式" >&2; exit 1; }
          test -f "release-tools/lees-phantom/notes-${VERSION}.md" || { echo "缺少 release-tools/lees-phantom/notes-${VERSION}.md" >&2; exit 1; }
          echo "revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-repo
          persist-credentials: false

      - name: 检出私有源码仓固定提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lyq2010/lees-phantom
          ref: ${{ needs.validate.outputs.revision }}
          ssh-key: ${{ secrets.PHANTOM_SOURCE_SSH_KEY }}
          path: private-source
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 安装固定版本的 DMG 布局工具与 Minisign
        run: |
          set -euo pipefail
          brew install minisign
          python3 -m pip install --break-system-packages --require-hashes -r private-source/packaging/macos/dmg/requirements.txt

      - name: 校验 Apple Silicon 与 Swift 环境
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64 || { echo "发行包必须在 Apple Silicon 上构建" >&2; exit 1; }
          swift --version

      - name: 从固定源码构建 Rust Phantom Engine
        run: |
          set -euo pipefail
          cargo --version
          cargo build --manifest-path private-source/Engine/Cargo.toml --locked --release -p phantom-engine
          ENGINE_BIN="$(pwd)/private-source/Engine/target/release/phantom-engine"
          test -x "$ENGINE_BIN"
          "$ENGINE_BIN" -v
          echo "PHANTOM_ENGINE_BIN=$ENGINE_BIN" >> "$GITHUB_ENV"

      - name: 运行 Rust、Swift 与真实双内核集成测试
        if: ${{ inputs.run_tests }}
        env:
          PHANTOM_RUN_ENGINE_LIVE_TESTS: '1'
          PHANTOM_RUN_MIHOMO_LIVE_TESTS: '1'
        run: |
          set -euo pipefail
          cargo test --manifest-path private-source/Engine/Cargo.toml --workspace --locked
          (cd private-source && swift test)

      - name: 校验双内核与 GeoIP 数据库
        run: |
          set -euo pipefail
          test -x "$PHANTOM_ENGINE_BIN"
          test -x private-source/Resources/bin/mihomo
          private-source/Resources/bin/mihomo -v
          test -f private-source/Resources/geo/geoip.metadb
          test -f private-source/Resources/geo/GeoLite2-ASN.mmdb
          "$PHANTOM_ENGINE_BIN" --check-geoip private-source/Resources/geo/geoip.metadb
          "$PHANTOM_ENGINE_BIN" --check-asn private-source/Resources/geo/GeoLite2-ASN.mmdb
          ls -lh "$PHANTOM_ENGINE_BIN" private-source/Resources/geo/geoip.metadb private-source/Resources/geo/GeoLite2-ASN.mmdb

      - name: 编译组装 Phantom.app、APFS 拖拽安装 DMG 与应用内更新包
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p public-assets
          bash private-source/packaging/macos/package.sh "$(pwd)/public-assets"

      - name: 签名最终发行资产
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          PHANTOM_BUILD_SHA: ${{ needs.validate.outputs.revision }}
          PHANTOM_UPDATER_PRIVATE_KEY: ${{ secrets.PHANTOM_UPDATER_PRIVATE_KEY }}
          PHANTOM_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.PHANTOM_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node release-repo/release-tools/lees-phantom/asset.mjs \
            "$(pwd)/public-assets" \
            darwin-aarch64 \
            "$APP_VERSION" \
            private-source/dist/Phantom.app/Contents/MacOS/Phantom \
            "lees-phantom-${APP_VERSION}-macos-aarch64.dmg" \
            "lees-phantom-${APP_VERSION}-macos-aarch64.app.tar.gz"

      - name: 仅上传公开白名单签名产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lees-phantom-macos
          path: |
            public-assets/lees-phantom-*-macos-aarch64.dmg
            public-assets/lees-phantom-*-macos-aarch64.dmg.minisig
            public-assets/lees-phantom-*-macos-aarch64.app.tar.gz
            public-assets/lees-phantom-*-macos-aarch64.app.tar.gz.minisig
            public-assets/darwin-aarch64.json
          if-no-files-found: error
          retention-days: 7

  verify-artifacts:
    needs: [validate, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lees-phantom-macos
          path: public-assets

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: sudo apt-get update -qq && sudo apt-get install -y minisign

      - name: 签发 Ed25519 发行清单并本地全量验签
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.revision }}
          PHANTOM_RELEASE_PRIVATE_KEY: ${{ secrets.PHANTOM_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node release-tools/lees-phantom/manifest.mjs public-assets "$VERSION" "$SOURCE_SHA"
          node release-tools/lees-phantom/verify.mjs public-assets > public-assets/verification.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lees-phantom-verified
          path: |
            public-assets/lees-phantom-*.dmg
            public-assets/lees-phantom-*.dmg.minisig
            public-assets/lees-phantom-*.app.tar.gz
            public-assets/lees-phantom-*.app.tar.gz.minisig
            public-assets/darwin-aarch64.json
            public-assets/release-manifest.json
            public-assets/SHA256SUMS
            public-assets/verification.json
          if-no-files-found: error
          retention-days: 7

  mirror-cos:
    if: ${{ !cancelled() && inputs.publish && needs.verify-artifacts.result == 'success' }}
    needs: verify-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lees-phantom-verified
          path: public-assets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python3 -m pip install cos-python-sdk-v5==1.9.45
      - run: python3 release-tools/lees-phantom/mirror.py stage cos public-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lees-phantom-ready-cos
          path: public-assets/readiness-cos.json
          retention-days: 7

  mirror-r2:
    if: ${{ !cancelled() && inputs.publish && needs.verify-artifacts.result == 'success' }}
    needs: verify-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lees-phantom-verified
          path: public-assets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python3 release-tools/lees-phantom/mirror.py stage r2 public-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lees-phantom-ready-r2
          path: public-assets/readiness-r2.json
          retention-days: 7

  promote:
    if: ${{ !cancelled() && inputs.publish && needs.mirror-cos.result == 'success' && needs.mirror-r2.result == 'success' }}
    needs: [mirror-cos, mirror-r2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lees-phantom-verified
          path: public-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lees-phantom-ready-*
          path: public-assets
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python3 -m pip install cos-python-sdk-v5==1.9.45
      - name: 从 GitHub 取得并验签旧版清单（不读取存储桶正文）
        run: python3 release-tools/lees-phantom/previous.py public-assets
      - name: 仅以 COS HEAD 与 R2 列表元数据复核并晋升双源 latest.json
        run: python3 release-tools/lees-phantom/mirror.py promote both public-assets
      - name: 发布公开 GitHub Release
        run: node release-tools/lees-phantom/publish.mjs public-assets

  cleanup-cos:
    if: ${{ !cancelled() && inputs.publish && needs.promote.result == 'success' }}
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lees-phantom-verified
          path: public-assets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python3 -m pip install cos-python-sdk-v5==1.9.45
      - run: python3 release-tools/lees-phantom/prune.py cos public-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lees-phantom-cleanup-cos
          path: public-assets/cleanup-cos.json
          retention-days: 7

  cleanup-r2:
    if: ${{ !cancelled() && inputs.publish && needs.promote.result == 'success' }}
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lees-phantom-verified
          path: public-assets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python3 -m pip install cos-python-sdk-v5==1.9.45
      - run: python3 release-tools/lees-phantom/prune.py r2 public-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lees-phantom-cleanup-r2
          path: public-assets/cleanup-r2.json
          retention-days: 7
